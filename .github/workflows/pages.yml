# Build the static bundle and publish it to GitHub Pages.
#
# There is no backend to deploy: `dist/` is the entire application (hard
# constraint 1). `base` is relative in vite.config.ts, so the bundle works from
# the /<repo>/ subdirectory Pages serves it from without any path rewriting.
#
# Pages must be set to "GitHub Actions" as its source, once, in
# Settings > Pages. Deploying from a branch is not used -- dist/ stays
# gitignored and is never committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but
# queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Never publish a bundle whose DSP is broken. The suite is ~4 s.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
