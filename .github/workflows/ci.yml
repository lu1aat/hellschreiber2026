# Typecheck, test and build on every push and pull request.
#
# `npm run build` runs `tsc --noEmit` first, and tsconfig has noUnusedLocals /
# noUnusedParameters on, so this is also the project's style gate -- there is no
# separate linter. See CLAUDE.md > Commands.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test
        run: npm run test

      - name: Typecheck + build
        run: npm run build
